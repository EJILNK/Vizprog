name: Typescript CI

on:
  push:
    branches: [master, lab1, lab4, lab5, lab6, lab7, final_project]
  pull_request:
    branches: [master, lab1, lab4, lab5, lab6, lab7, final_project]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test
