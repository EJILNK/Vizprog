name: Typescript CI

on:
  push:
    branches: [final_project]
  pull_request:
    branches: [final_project]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Debug package files
        run: |
          pwd
          ls
          echo "package.json typescript:"
          cat package.json | grep typescript || true
          echo "package-lock.json typescript:"
          grep -n '"typescript"' package-lock.json | head -20 || true

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test
